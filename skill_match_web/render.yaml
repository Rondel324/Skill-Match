   services:
     - type: web
       name: skill-match
       runtime: python
       plan: free
       buildCommand: pip install -r requirements.txt
       startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
       healthCheckPath: /healthz
       envVars:
         - key: SECRET_KEY
           generateValue: true
         - key: COOKIE_SECURE
           value: "1"
         - key: DATABASE_URL
           sync: false
